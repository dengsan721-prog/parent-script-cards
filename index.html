    function bindCards() { app.querySelectorAll("[data-key]").forEach(btn => btn.addEventListener("click", () => setView("detail", { selectedKey:btn.dataset.key }))); }
    function renderHome() { app.innerHTML = `${topbar("幸福驿站", false)}<section class="hero"><h1 class="hero-title">亲子沟通话术速查卡</h1><p class="hero-copy">孩子的问题来的很突然，快速找到一句稳住关系的话。</p><div class="stats"><div class="stat"><strong>72</strong><span>应对话术</span></div><div class="stat"><strong>100</strong><span>聊天话题</span></div></div><div class="entry-grid"><button class="entry-button primary" data-action="search" type="button"><strong>搜索</strong><span>按关键词找到当下能用的一张卡。</span></button><button class="entry-button secondary" data-action="browse" type="button"><strong>0-18岁亲子问题100问 <em class="entry-cta">点击查看</em></strong><span>按分类浏览常见亲子问题和亲子聊天100话题。</span></button></div><p class="soft-note">先共情，再引导。高风险场景请及时寻求专业帮助。</p></section>`; app.querySelector("[data-action=search]").addEventListener("click", () => setView("search")); app.querySelector("[data-action=browse]").addEventListener("click", () => setView("browse")); }
    function renderSearch() { const results = searchItems(state.query, state.searchType); app.innerHTML = `${topbar("搜索")}<section class="toolbar"><input class="search-box" value="${state.query.replace(/"/g, "&quot;")}" placeholder="输入关键词，如 写作业、秘密、朋友"><div class="segmented"><button class="seg-btn ${state.searchType==="all"?"active":""}" data-type="all" type="button">全部</button><button class="seg-btn ${state.searchType==="response_card"?"active":""}" data-type="response_card" type="button">应对话术</button><button class="seg-btn ${state.searchType==="chat_topic"?"active":""}" data-type="chat_topic" type="button">亲子聊天100话题</button></div></section><div class="chips">${["写作业","撒谎","欺负","早恋","秘密","幸福","朋友","害怕","梦想"].map(k => `<button class="chip" data-keyword="${k}" type="button">${k}</button>`).join("")}</div><section><h2 class="section-title">搜索结果 ${results.length}</h2><div class="card-list two">${results.map(cardButton).join("") || '<div class="empty">换个关键词试试</div>'}</div></section>`; bindBack(); bindCards(); const input = app.querySelector(".search-box"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); input.addEventListener("input", event => { state.query = event.target.value; renderSearch(); }); app.querySelectorAll("[data-type]").forEach(btn => btn.addEventListener("click", () => { state.searchType = btn.dataset.type; renderSearch(); })); app.querySelectorAll("[data-keyword]").forEach(btn => btn.addEventListener("click", () => { state.query = btn.dataset.keyword; renderSearch(); })); }
    function groupByCategory(items, categories) { return categories.map(category => [category, items.filter(item => item.category === category)]); }
    function renderBrowse() { const isResponse = state.browseType === "response"; const groups = isResponse ? groupByCategory(RESPONSE_CARDS, RESPONSE_CATEGORIES) : groupByCategory(CHAT_TOPICS, TOPIC_CATEGORIES); app.innerHTML = `${topbar("寻找")}<section class="toolbar"><div class="segmented"><button class="seg-btn ${isResponse?"active":""}" data-browse="response" type="button">常见问题</button><button class="seg-btn ${!isResponse?"active":""}" data-browse="topic" type="button">亲子聊天100话题</button></div></section>${groups.map(([category, items]) => `<section class="category-block"><div class="category-head"><h2>${category}</h2><span>${items.length} 张</span></div><div class="waterfall-list">${items.map(waterfallButton).join("")}</div></section>`).join("")}`; bindBack(); bindCards(); app.querySelectorAll("[data-browse]").forEach(btn => btn.addEventListener("click", () => { state.browseType = btn.dataset.browse; renderBrowse(); })); }
    function scriptStepLabel(index) {
      return ["先说这一句", "再问一句", "守住边界", "下一步怎么做", "大春之道提醒"][index] || "补充提醒";
    }
    function scriptStepClass(index) {
      if (index === 2) return "boundary-step";
      if (index === 3) return "action-step";
      return "";
    }
    function renderDetail() { const item = allItems().find(candidate => itemKey(candidate) === state.selectedKey); if (!item) { setView("home"); return; } const isResponse = item.type === "response_card"; const copyValue = isResponse ? item.scripts.join("\n") : item.prompt; app.innerHTML = `${topbar(isResponse ? "应对话术" : "聊天话题")}<article class="detail"><div class="meta"><span class="pill ${typeClass(item)}">${typeLabel(item)}</span><span>#${item.id}</span><span>${item.category}</span></div><h1>${item.title}</h1><p class="summary">${item.summary}</p>${item.riskLevel === "urgent" ? '<div class="risk-note">这个场景需要谨慎处理。话术只能用于初步安抚和沟通，必要时请及时联系学校、警方、医生、心理或儿童保护相关专业机构。</div>' : ""}${isResponse ? `<h2 class="section-title">可以这样说</h2><ul class="script-list">${item.scripts.map((script, index) => `<li class="${scriptStepClass(index)}"><span class="detail-step-label">${scriptStepLabel(index)}</span>${script}</li>`).join("")}</ul>` : `<h2 class="section-title">可以这样问</h2><ul class="script-list"><li><span class="detail-step-label">轻松开场</span>${item.prompt}</li></ul><p class="summary">适合场景：${item.occasion}</p>`}<p class="soft-note">${item.tip}</p><button class="copy-btn" type="button">一键复制</button></article>`; bindBack(); app.querySelector(".copy-btn").addEventListener("click", () => copyText(copyValue)); }
    function openResponseSearch(query = "") { state.query = query; state.searchType = "response_card"; setView("search"); }
    function renderHome() {
      const previews = RESPONSE_CARDS.filter(item => [3, 5, 8, 44, 53, 67, 73, 85, 112].includes(item.id));
      app.innerHTML = `${topbar("大春之道幸福驿站", false)}<section class="hero"><h1 class="hero-title">亲子沟通话术速查卡</h1><p class="hero-copy">孩子的问题来的很突然，快速找到一句稳住关系的话。</p><section class="primary-search-panel"><div class="home-search-row"><input class="home-search-input" placeholder="孩子现在遇到什么问题？" aria-label="孩子现在遇到什么问题"><button class="home-search-button" data-home-search type="button">搜索话术</button></div><div class="quick-grid">${HOT_RESPONSE_CHIPS.map(chip => `<button class="chip" data-hot-label="${chip.label}" data-hot-query="${chip.query}" type="button">${chip.label}</button>`).join("")}</div><div class="urgent-lane"><div class="urgent-lane-head"><strong>急用先选</strong><span>10万人模拟测试后保留的高频入口</span></div><div class="urgent-grid">${URGENT_SCENE_CHIPS.map(chip => `<button class="urgent-chip" data-urgent-query="${chip.query}" type="button"><strong>${chip.label}</strong><span>${chip.hint}</span></button>`).join("")}</div></div></section><section class="answer-first-panel"><div class="category-head"><h2>按常见问题寻找</h2><span>${RESPONSE_CARDS.length}个问题</span></div><button class="entry-button secondary" data-action="browse" type="button"><strong>0-18岁亲子问题100问 <em class="entry-cta">点击查看</em></strong><span>不知道怎么搜时，从学习、手机、校园、社交、青春期、父母成长等分类里找。</span></button><div class="preview-problems">${previews.map(item => `<button class="preview-problem" data-key="${itemKey(item)}" type="button"><strong>${item.title}</strong><span>${item.category}</span></button>`).join("")}</div></section><section class="aux-topic-panel"><h2>亲子聊天100话题</h2><p>平时关系维护使用，适合睡前、饭后、散步时轻松聊一题。</p><button class="mini-btn" data-topic-entry type="button">查看聊天话题</button></section></section>`;
      const homeInput = app.querySelector(".home-search-input");
      app.querySelector("[data-home-search]").addEventListener("click", () => openResponseSearch(homeInput.value));
      homeInput.addEventListener("keydown", event => { if (event.key === "Enter") openResponseSearch(homeInput.value); });
      app.querySelectorAll("[data-hot-query]").forEach(btn => btn.addEventListener("click", () => openResponseSearch(btn.dataset.hotQuery)));
      app.querySelectorAll("[data-urgent-query]").forEach(btn => btn.addEventListener("click", () => openResponseSearch(btn.dataset.urgentQuery)));
      app.querySelector("[data-action=browse]").addEventListener("click", () => setView("browse", { browseType:"response" }));
      app.querySelector("[data-topic-entry]").addEventListener("click", () => setView("browse", { browseType:"topic" }));
      bindCards();
    }
    function renderSearch() {
      const results = searchItems(state.query, state.searchType);
      const title = state.searchType === "chat_topic" ? "搜索聊天话题" : "搜索常见问题话术";
      const chips = state.searchType === "chat_topic" ? HOT_TOPIC_CHIPS.map(label => ({ label, query:label })) : [...HOT_RESPONSE_CHIPS, { label:"自杀", query:"自杀" }];
      app.innerHTML = `${topbar(title)}<section class="toolbar"><input class="search-box" value="${state.query.replace(/"/g, "&quot;")}" placeholder="输入关键词，如 写作业、手机、青春期"><div class="segmented"><button class="seg-btn ${state.searchType==="response_card"?"active":""}" data-type="response_card" type="button">常见问题话术</button><button class="seg-btn ${state.searchType==="chat_topic"?"active":""}" data-type="chat_topic" type="button">亲子聊天100话题</button></div></section><div class="chips">${chips.map(chip => `<button class="chip" data-keyword="${chip.query}" type="button">${chip.label}</button>`).join("")}</div><section><h2 class="section-title">搜索结果 ${results.length}</h2><div class="card-list two">${results.map(cardButton).join("") || '<div class="empty">换个关键词试试</div>'}</div></section>`;
      bindBack(); bindCards();
      const input = app.querySelector(".search-box");
      input.focus(); input.setSelectionRange(input.value.length, input.value.length);
      input.addEventListener("input", event => { state.query = event.target.value; renderSearch(); });
      app.querySelectorAll("[data-type]").forEach(btn => btn.addEventListener("click", () => { state.searchType = btn.dataset.type; state.query = ""; renderSearch(); }));
      app.querySelectorAll("[data-keyword]").forEach(btn => btn.addEventListener("click", () => { state.query = btn.dataset.keyword; renderSearch(); }));
    }
    function renderBrowse() {
      const isResponse = state.browseType !== "topic";
      const groups = isResponse ? groupByCategory(RESPONSE_CARDS, RESPONSE_CATEGORIES) : groupByCategory(CHAT_TOPICS, TOPIC_CATEGORIES);
      app.innerHTML = `${topbar(isResponse ? "按常见问题寻找" : "亲子聊天100话题")}<section class="toolbar"><div class="segmented"><button class="seg-btn ${isResponse?"active":""}" data-browse="response" type="button">常见问题 ${RESPONSE_CARDS.length} 问</button><button class="seg-btn ${!isResponse?"active":""}" data-browse="topic" type="button">亲子聊天100话题</button></div></section>${groups.map(([category, items]) => `<section class="category-block"><div class="category-head"><h2>${category}</h2><span>${items.length} 张</span></div><div class="waterfall-list">${items.map(waterfallButton).join("")}</div></section>`).join("")}`;
      bindBack(); bindCards();
      app.querySelectorAll("[data-browse]").forEach(btn => btn.addEventListener("click", () => { state.browseType = btn.dataset.browse; renderBrowse(); }));
    }
    function render() { if (state.view === "home") renderHome(); if (state.view === "search") renderSearch(); if (state.view === "browse") renderBrowse(); if (state.view === "detail") renderDetail(); }
    render();
  </script>
</body>
</html>
